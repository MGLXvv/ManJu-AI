name: Frontend CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p6-4-baseline-bootstrap:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'quality/assets-visual-memory' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format P6.4 text files
        run: |
          pnpm exec prettier --write \
            .github/workflows/frontend-ci.yml \
            build-budget.config.mjs \
            package.json \
            src/layouts/EditorLayout.vue \
            src/main.ts \
            src/pages/auth/LoginPage.vue \
            src/services/media/mediaBlobRepository.ts \
            src/services/runtime/runtimeResourceDiagnostics.ts \
            src/vite-env.d.ts \
            tests/unit/runtimeResourceDiagnostics.test.ts \
            tools/e2e/mock-scenario-suite.mjs \
            tools/e2e/scenarios/editor-long-session.mjs \
            tools/e2e/visual-regression.mjs

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate visual baselines
        run: pnpm test:visual:update

      - name: Commit formatting and baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/frontend-ci.yml build-budget.config.mjs package.json
          git add src/layouts/EditorLayout.vue src/main.ts src/pages/auth/LoginPage.vue
          git add src/services/media/mediaBlobRepository.ts src/services/runtime/runtimeResourceDiagnostics.ts src/vite-env.d.ts
          git add tests/unit/runtimeResourceDiagnostics.test.ts
          git add -f tools/e2e/mock-scenario-suite.mjs tools/e2e/scenarios/editor-long-session.mjs tools/e2e/visual-regression.mjs tools/e2e/visual-baselines
          git commit -m "test: add p6.4 visual baselines"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload baseline generation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-4-baseline-bootstrap
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 14

  quality:
    name: Static checks, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Check HTTP and Mock dependency boundary
        run: pnpm check:http-mock-boundary

      - name: Check integration configuration consistency
        run: pnpm check:integration-consistency

      - name: Check source asset budgets
        run: pnpm check:source-assets

      - name: Check source hygiene
        run: pnpm check:source-hygiene

      - name: Run ESLint regression check
        run: pnpm lint

      - name: Check changed file formatting
        run: pnpm format:check

      - name: Check SCSS regression baseline
        run: pnpm stylelint

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Build and verify production bundle
        run: pnpm build:verify

      - name: Upload frontend quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-diagnostics
          path: artifacts/quality
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: artifacts/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload frontend build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-report
          path: artifacts/build
          if-no-files-found: ignore
          retention-days: 14

  windows-quality:
    name: Windows quality scripts
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Check HTTP and Mock dependency boundary
        run: pnpm check:http-mock-boundary

      - name: Check integration configuration consistency
        run: pnpm check:integration-consistency

      - name: Check source asset budgets
        run: pnpm check:source-assets

      - name: Check source hygiene
        run: pnpm check:source-hygiene

      - name: Run ESLint regression check
        run: pnpm lint

      - name: Check changed file formatting
        run: pnpm format:check

      - name: Check SCSS regression baseline
        run: pnpm stylelint

  mock-e2e:
    name: Playwright Mock main flow
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright Mock main flow
        run: pnpm test:e2e:mock

      - name: Run visual regression
        run: pnpm test:visual

      - name: Upload E2E reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-e2e-report
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 14
