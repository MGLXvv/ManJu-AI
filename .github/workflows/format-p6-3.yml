name: Render P6.3 formatted files

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  render:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'quality/accessibility-mock-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format files in place
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          import { format, resolveConfig } from 'prettier'

          const files = [
            'src/components/dashboard/CreateProjectModal.vue',
            'tools/e2e/accessibility-scan.mjs',
            'tools/e2e/mock-e2e-runtime.mjs',
            'tools/e2e/mock-scenario-suite.mjs',
            'tools/e2e/scenarios/editor-persistence.mjs',
            'tools/e2e/scenarios/project-management.mjs',
          ]

          for (const file of files) {
            const source = await readFile(file, 'utf8')
            const config = (await resolveConfig(file)) ?? {}
            const output = await format(source, { ...config, filepath: file })
            await writeFile(file, output, 'utf8')
          }
          NODE

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/CreateProjectModal.vue
          git add -f tools/e2e/accessibility-scan.mjs
          git add -f tools/e2e/mock-e2e-runtime.mjs
          git add -f tools/e2e/mock-scenario-suite.mjs
          git add -f tools/e2e/scenarios/editor-persistence.mjs
          git add -f tools/e2e/scenarios/project-management.mjs
          if git diff --cached --quiet; then
            echo "P6.3 files are already formatted."
            exit 0
          fi
          git commit -m "style: format p6.3 files"
          git push origin HEAD:${{ github.head_ref }}
