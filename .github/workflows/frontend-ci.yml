name: Frontend CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p6-4-visual-baseline-commit:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'quality/assets-visual-memory' &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate stable visual baselines
        run: pnpm test:visual:update

      - name: Restore visual comparison command
        run: |
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises'
          const packageJson = JSON.parse(await readFile('package.json', 'utf8'))
          packageJson.scripts['test:visual'] = 'node tools/e2e/visual-regression.mjs'
          await writeFile('package.json', `${JSON.stringify(packageJson, null, 2)}\n`, 'utf8')
          EOF
          pnpm exec prettier --write package.json

      - name: Commit stable baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git add -f tools/e2e/visual-baselines
          git diff --cached --quiet || git commit -m "test: commit stable visual baselines"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    name: Static checks, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Check HTTP and Mock dependency boundary
        run: pnpm check:http-mock-boundary

      - name: Check integration configuration consistency
        run: pnpm check:integration-consistency

      - name: Check source asset budgets
        run: pnpm check:source-assets

      - name: Check source hygiene
        run: pnpm check:source-hygiene

      - name: Run ESLint regression check
        run: pnpm lint

      - name: Check changed file formatting
        run: pnpm format:check

      - name: Check SCSS regression baseline
        run: pnpm stylelint

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Build and verify production bundle
        run: pnpm build:verify

      - name: Upload frontend quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-diagnostics
          path: artifacts/quality
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: artifacts/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload frontend build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-report
          path: artifacts/build
          if-no-files-found: ignore
          retention-days: 14

  windows-quality:
    name: Windows quality scripts
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Check HTTP and Mock dependency boundary
        run: pnpm check:http-mock-boundary

      - name: Check integration configuration consistency
        run: pnpm check:integration-consistency

      - name: Check source asset budgets
        run: pnpm check:source-assets

      - name: Check source hygiene
        run: pnpm check:source-hygiene

      - name: Run ESLint regression check
        run: pnpm lint

      - name: Check changed file formatting
        run: pnpm format:check

      - name: Check SCSS regression baseline
        run: pnpm stylelint

  mock-e2e:
    name: Playwright Mock main flow
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright Mock main flow
        run: pnpm test:e2e:mock

      - name: Run visual regression
        run: pnpm test:visual

      - name: Upload E2E reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-e2e-report
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 14
