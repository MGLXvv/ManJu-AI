name: Format quality files

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'quality/eslint-stylelint-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format quality files
        run: >-
          pnpm exec prettier --write
          .github/workflows/frontend-ci.yml
          eslint.config.mjs
          package.json
          prettier.config.mjs
          stylelint.config.mjs
          tools/quality/check-changed-format.mjs
          tools/quality/check-eslint-baseline.mjs
          tools/quality/check-integration-consistency.mjs
          tools/quality/check-stylelint-baseline.mjs
          tools/quality/eslint-baseline.json
          tools/quality/stylelint-baseline.json
          vite.config.ts

      - name: Upload formatted quality files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-quality-files
          path: |
            .github/workflows/frontend-ci.yml
            eslint.config.mjs
            package.json
            prettier.config.mjs
            stylelint.config.mjs
            tools/quality/check-changed-format.mjs
            tools/quality/check-eslint-baseline.mjs
            tools/quality/check-integration-consistency.mjs
            tools/quality/check-stylelint-baseline.mjs
            tools/quality/eslint-baseline.json
            tools/quality/stylelint-baseline.json
            vite.config.ts
          retention-days: 2
