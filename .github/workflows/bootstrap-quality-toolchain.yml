name: Bootstrap quality toolchain

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: bootstrap-quality-toolchain-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'quality/eslint-stylelint-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install quality dependencies
        run: >-
          pnpm add --save-dev
          eslint
          @eslint/js
          typescript-eslint
          eslint-plugin-vue
          vue-eslint-parser
          globals
          prettier
          stylelint
          stylelint-config-standard-scss
          @vitest/coverage-v8@4.1.7

      - name: Generate SCSS baseline
        run: pnpm stylelint:baseline

      - name: Format quality configuration
        run: >-
          pnpm exec prettier --write
          eslint.config.mjs
          prettier.config.mjs
          stylelint.config.mjs
          tools/quality/check-changed-format.mjs
          tools/quality/check-stylelint-baseline.mjs
          vite.config.ts
          package.json

      - name: Commit generated dependency state
        run: |
          mkdir -p artifacts/bootstrap
          set +e
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json pnpm-lock.yaml tools/quality/stylelint-baseline.json eslint.config.mjs prettier.config.mjs stylelint.config.mjs tools/quality/check-changed-format.mjs tools/quality/check-stylelint-baseline.mjs vite.config.ts
            git status --short
            if git diff --cached --quiet; then
              echo "No generated changes to commit."
            else
              git commit -m "chore: lock frontend quality toolchain"
              git push origin HEAD:${{ github.head_ref }}
            fi
          } > artifacts/bootstrap/git-push.log 2>&1
          exit_code=$?
          cat artifacts/bootstrap/git-push.log
          echo "Git write exit code: $exit_code"
          exit 0

      - name: Upload generated quality state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-toolchain-writeback
          path: |
            package.json
            pnpm-lock.yaml
            tools/quality/stylelint-baseline.json
            eslint.config.mjs
            prettier.config.mjs
            stylelint.config.mjs
            tools/quality/check-changed-format.mjs
            tools/quality/check-stylelint-baseline.mjs
            vite.config.ts
            artifacts/bootstrap
          retention-days: 2
