name: Quality bootstrap

on:
  push:
    branches:
      - agent/frontend-quality-hardening

permissions:
  contents: write

jobs:
  migrate-login-hero:
    if: ${{ !contains(github.event.head_commit.message, '[quality-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontend-quality-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Apply exact source migration
        run: node tools/maintenance/apply-quality-hardening.mjs

      - name: Commit migration and remove bootstrap files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/auth/LoginPage.vue src/styles/pages/login.scss
          git rm tools/maintenance/apply-quality-hardening.mjs .github/workflows/quality-bootstrap.yml
          git commit -m "refactor: lazy load login artwork [quality-bootstrap]"
          git push origin HEAD:agent/frontend-quality-hardening
