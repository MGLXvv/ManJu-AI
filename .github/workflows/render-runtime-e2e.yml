name: Render runtime recovery e2e

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  render:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'quality/runtime-error-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render formatted E2E file
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises'
          import { format, resolveConfig } from 'prettier'

          const sourcePath = 'tools/e2e/mock-main-flow.mjs'
          const outputPath = 'artifacts/formatted-e2e/mock-main-flow.mjs'
          const source = await readFile(sourcePath, 'utf8')
          const config = (await resolveConfig(sourcePath)) ?? {}
          const output = await format(source, { ...config, filepath: sourcePath })
          await mkdir('artifacts/formatted-e2e', { recursive: true })
          await writeFile(outputPath, output, 'utf8')
          NODE

      - name: Upload formatted E2E file
        uses: actions/upload-artifact@v4
        with:
          name: rendered-runtime-recovery-e2e
          path: artifacts/formatted-e2e/mock-main-flow.mjs
          retention-days: 2
