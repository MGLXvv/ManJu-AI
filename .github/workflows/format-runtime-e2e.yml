name: Format runtime recovery e2e

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'quality/runtime-error-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format E2E file
        run: pnpm exec prettier --write tools/e2e/mock-main-flow.mjs

      - name: Upload formatted E2E file
        uses: actions/upload-artifact@v4
        with:
          name: formatted-runtime-recovery-e2e
          path: tools/e2e/mock-main-flow.mjs
          retention-days: 2
