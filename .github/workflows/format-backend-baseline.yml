name: Format Backend Baseline

on:
  push:
    branches:
      - integration/backend-contract-baseline

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/backend-contract-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/backend-integration
      - name: Commit formatted documentation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/backend-integration
          git commit -m "docs: format backend integration baseline"
          git push origin HEAD:integration/backend-contract-baseline
