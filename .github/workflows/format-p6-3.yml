name: Render P6.3 formatted files

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  render:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'quality/accessibility-mock-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render formatted files
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises'
          import path from 'node:path'
          import { format, resolveConfig } from 'prettier'

          const files = [
            'src/components/dashboard/CreateProjectModal.vue',
            'tools/e2e/accessibility-scan.mjs',
            'tools/e2e/mock-e2e-runtime.mjs',
            'tools/e2e/mock-scenario-suite.mjs',
            'tools/e2e/scenarios/editor-persistence.mjs',
            'tools/e2e/scenarios/project-management.mjs',
          ]

          for (const file of files) {
            const source = await readFile(file, 'utf8')
            const config = (await resolveConfig(file)) ?? {}
            const output = await format(source, { ...config, filepath: file })
            const target = path.join('artifacts', 'formatted-p6-3', file)
            await mkdir(path.dirname(target), { recursive: true })
            await writeFile(target, output, 'utf8')
          }
          NODE

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-p6-3-files
          path: artifacts/formatted-p6-3
          retention-days: 2
