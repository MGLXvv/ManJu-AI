name: Diagnose P6.3 Stylelint

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'quality/accessibility-mock-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export Stylelint diagnostics
        run: |
          mkdir -p artifacts/stylelint
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          import stylelint from 'stylelint'

          const result = await stylelint.lint({
            allowEmptyInput: true,
            files: ['src/**/*.scss'],
            formatter: 'json',
          })

          const violations = result.results.flatMap((file) =>
            file.warnings.map((warning) => ({
              source: file.source,
              line: warning.line,
              column: warning.column,
              rule: warning.rule,
              text: warning.text,
            })),
          )

          await writeFile('artifacts/stylelint/report.json', `${JSON.stringify(violations, null, 2)}\n`, 'utf8')
          await writeFile(
            'artifacts/stylelint/report.txt',
            `${violations.map((item) => `${item.source}:${item.line}:${item.column} ${item.rule} ${item.text}`).join('\n')}\n`,
            'utf8',
          )
          NODE

      - name: Upload Stylelint diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: p6-3-stylelint-diagnostics
          path: artifacts/stylelint
          retention-days: 2
