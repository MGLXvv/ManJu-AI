name: Format runtime recovery files

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'quality/runtime-error-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format runtime recovery files
        run: |
          pnpm exec prettier --write \
            src/api/local.ts \
            src/components/app/GlobalRuntimeErrorPanel.vue \
            src/router/index.ts \
            src/services/runtime/appError.ts \
            tests/unit/api/local.recovery.test.ts \
            tests/unit/services/runtime/appError.test.ts \
            tests/unit/services/runtime/installGlobalErrorHandlers.test.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/api/local.ts \
            src/components/app/GlobalRuntimeErrorPanel.vue \
            src/router/index.ts \
            src/services/runtime/appError.ts \
            tests/unit/api/local.recovery.test.ts \
            tests/unit/services/runtime/appError.test.ts \
            tests/unit/services/runtime/installGlobalErrorHandlers.test.ts
          if git diff --cached --quiet; then
            echo "Runtime recovery files are already formatted."
            exit 0
          fi
          git commit -m "style: format runtime recovery files"
          git push origin HEAD:${{ github.head_ref }}
