name: Bootstrap quality toolchain

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install quality dependencies
        run: >-
          pnpm add --save-dev
          eslint
          @eslint/js
          typescript-eslint
          eslint-plugin-vue
          vue-eslint-parser
          globals
          prettier
          stylelint
          stylelint-config-standard-scss
          @vitest/coverage-v8@4.1.7

      - name: Generate SCSS baseline diagnostics
        run: |
          mkdir -p artifacts/bootstrap
          set +e
          pnpm stylelint:baseline > artifacts/bootstrap/stylelint-baseline.log 2>&1
          exit_code=$?
          cat artifacts/bootstrap/stylelint-baseline.log
          echo "Stylelint baseline exit code: $exit_code"
          exit 0

      - name: Format quality configuration
        run: >-
          pnpm exec prettier --write
          eslint.config.mjs
          prettier.config.mjs
          stylelint.config.mjs
          tools/quality/check-changed-format.mjs
          tools/quality/check-stylelint-baseline.mjs
          vite.config.ts
          package.json

      - name: Upload generated quality state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-toolchain-bootstrap
          path: |
            package.json
            pnpm-lock.yaml
            tools/quality/stylelint-baseline.json
            eslint.config.mjs
            prettier.config.mjs
            stylelint.config.mjs
            tools/quality/check-changed-format.mjs
            tools/quality/check-stylelint-baseline.mjs
            vite.config.ts
            artifacts/bootstrap
          if-no-files-found: warn
          retention-days: 2
